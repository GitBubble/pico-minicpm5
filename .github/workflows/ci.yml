name: ci

on:
  push:
  pull_request:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[onnx,dev]'
      - run: pytest
      - run: pico-minicpm5 release source --check-only
      - run: python -m build

# Checkpoint download, ATC, libinstsim and SS928 jobs intentionally do not run
# on public hosted workers. Configure them only on a private self-hosted runner
# that does not upload SDK, checkpoint or board artifacts to a public cache.
